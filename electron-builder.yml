appId: com.eliyazar.kendo-tournament-manager
productName: Kendo Tournament Manager
directories:
  output: release/${version}
files:
  - out/**
  - package.json
  - "!**/*.map"
publish: null
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ${productName}-Setup-${version}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.sports
linux:
  target:
    - target: AppImage
      arch:
        - x64
